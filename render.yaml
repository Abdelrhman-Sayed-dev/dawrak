services:
  - type: web
    name: dawrak
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/config
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        sync: false          # تضيفه يدوياً من لوحة Render (رابط Neon)
      - key: JWT_SECRET
        generateValue: true  # Render يولّد قيمة عشوائية آمنة
      - key: GOOGLE_CLIENT_ID
        sync: false          # اختياري
