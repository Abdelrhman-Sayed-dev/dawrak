:root{--p:#2563EB;--pd:#0B2D5B;--pl:#EFF6FF;--lb:#BFDBFE;--bg:#F8FAFC;--c:#fff;--t:#0F172A;--m:#64748B;--b:#E2E8F0;--ok:#16A34A;--err:#DC2626;--navy:#0B2D5B;--ac:#2563EB;--sh:0 1px 2px rgba(15,23,42,.05),0 4px 14px rgba(15,23,42,.04);--r:16px;--r2:12px}

// فتح ملف محمي: نجلبه بالتوكن ثم نعرضه في تبويب جديد
async function openFile(path) {
  const w = window.open('', '_blank'); if (!w) { toast('اسمح بالنوافذ المنبثقة لفتح الملف'); return; }
  try {
    const r = await fetch('/api' + path, { headers: { Authorization: 'Bearer ' + localStorage.tok } });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'تعذر فتح الملف');
    w.location = URL.createObjectURL(await r.blob());
  } catch (e) { w.close(); toast(e.message); }
}
// تجهيز الملف للرفع: الصور تُصغَّر إلى 1800px، وPDF بحد 3 ميجا
const readFile = f => new Promise((res, rej) => {
  const r = new FileReader();
  if (f.type.startsWith('image/')) {
    r.onload = () => { const i = new Image(); i.onerror = () => rej(new Error('صورة غير صالحة')); i.onload = () => { const k = Math.min(1, 1800 / Math.max(i.width, i.height)), c = document.createElement('canvas'); c.width = Math.round(i.width * k); c.height = Math.round(i.height * k); c.getContext('2d').drawImage(i, 0, 0, c.width, c.height); res({ mime: 'image/jpeg', data: c.toDataURL('image/jpeg', .85).split(',')[1], name: f.name.replace(/\.\w+$/, '') + '.jpg' }); }; i.src = r.result; };
  } else if (f.type === 'application/pdf') {
    if (f.size > 3 * 1024 * 1024) return rej(new Error('حجم الملف يجب ألا يتجاوز 3 ميجا'));
    r.onload = () => res({ mime: f.type, data: r.result.split(',')[1], name: f.name });
  } else return rej(new Error('الملفات المسموحة: صور أو PDF'));
  r.readAsDataURL(f);
});

// نافذة تقرير الكشف + الروشتة + الاستشارة، ثم إنهاء الكشف
function fin(id) {
  modal(`<h3>تقرير الكشف والروشتة</h3><form id="rp" novalidate onsubmit="return false"><label>تقرير الكشف (التشخيص والملاحظات)<textarea rows="4" maxlength="3000"></textarea></label><h4 style="margin-top:14px">الروشتة (الأدوية)</h4><div id="meds"></div><button type="button" class="btn o sm" onclick="addMed()">${ic('plus')} إضافة دواء</button><h4 style="margin-top:16px">هل يحتاج المريض استشارة (متابعة)؟</h4><div class="seg"><label><input type="radio" name="fu" value="no" checked><span>لا</span></label><label><input type="radio" name="fu" value="yes"><span>نعم</span></label></div><div id="fud" style="display:none"><label>بعد كم يوم؟<input type="number" id="fun" min="1" max="365" placeholder="مثال: 7"></label></div><div class="err" id="er"></div><button type="button" class="btn ok lg" id="sv">حفظ وإنهاء الكشف</button></form>`);
  addMed();
  document.querySelectorAll('#rp [name=fu]').forEach(r => r.onchange = () => { $('#fud').style.display = $('#rp [name=fu]:checked').value === 'yes' ? 'block' : 'none'; });
  $('#sv').onclick = async () => {
    const b = $('#sv'), er = $('#er'); er.textContent = '';
    const rep = $('#rp textarea').value.trim();
    if (rep.length < 3) { er.textContent = 'اكتب تقرير الكشف أولاً (3 أحرف على الأقل)'; return; }
    let days = null;
    if ($('#rp [name=fu]:checked').value === 'yes') { days = parseInt($('#fun').value, 10); if (!(days >= 1 && days <= 365)) { er.textContent = 'اكتب عدد أيام الاستشارة (من 1 إلى 365)'; return; } }
    const medications = [...document.querySelectorAll('#meds .med')].map(r => ({ name: r.children[0].value, dose: r.children[1].value, freq: r.children[2].value, notes: r.children[3].value })).filter(m => m.name.trim());
    b.disabled = true; b.textContent = 'جاري الحفظ...';
    try {
      await api('/doctor/report/' + id, { method: 'PUT', body: { report: rep, medications, follow_up_days: days } });
      await api('/doctor/finish', { method: 'POST' });
      closeModal(); toast('تم حفظ التقرير وإنهاء الكشف', 1); cur();
    } catch (x) { console.error(x); er.textContent = x.message || 'حدث خطأ، حاول مرة أخرى'; b.disabled = false; b.textContent = 'حفظ وإنهاء الكشف'; }
  };
}
// ملف المريض عند الطبيب (فرد العيلة يظهر بياناته هو + ولي الأمر)
async function pf(id, m = 0) {
  try {
    const r = await api('/doctor/patient/' + id + '?m=' + m), p = r.profile, VC = { Completed: 'c', Waiting: 'w', 'In Progress': 'p' };
    const done = r.visits.filter(v => v.status === 'Completed');
    const wa = String(p.whatsapp).replace(/\D/g, '').replace(/^0/, '20');
    const chronic = p.chronic_conditions.length ? `<div class="pt-ch">${p.chronic_conditions.map(x => `<span>${ic('heart-pulse')}${esc(x)}</span>`).join('')}</div>` : `<div class="pt-ok">${ic('shield-check')} لا توجد أمراض مزمنة مسجلة</div>`;
    const visit = v => `<div class="pt-v ${VC[v.status] || ''}"><div class="pt-vh"><span class="pt-d">${ic('calendar')} ${fdn(v.booking_date)}</span><span class="pt-s ${VC[v.status] || ''}">${SL[v.status]}</span></div>${filesHtml(v.files, 'doctor')}${v.report ? `<div class="pt-r"><b>${ic('file-text')} تقرير الكشف</b><p>${esc(v.report)}</p></div>${(v.medications || []).length ? `<div class="pt-pills">${v.medications.map(m => `<span><b>${esc(m.name)}</b>${[m.dose, m.freq, m.notes || m.duration].filter(Boolean).map(t => ' · ' + esc(t)).join('')}</span>`).join('')}</div>` : ''}${v.follow_up_date ? `<div class="pt-fu">${ic('calendar-check')} موعد الاستشارة: ${fuTxt(v)}</div>` : ''}` : v.status === 'Completed' ? '' : '<p class="mt" style="margin-top:6px">لا يوجد تقرير بعد.</p>'}</div>`;
    modal(`<div class="pt"><button class="pt-x" onclick="closeModal()" aria-label="إغلاق">${ic('x')}</button>
    <div class="pt-h"><div class="pt-av">${esc([...p.name][0] || '؟')}</div><div class="pt-id"><h3>${esc(p.name)}</h3><span class="pt-age">${esc(p.age)} سنة</span>${p.guardian ? `<br><small class="mt">${esc(p.relation)} · ولي الأمر: ${esc(p.guardian)}</small>` : ''}</div></div>
    <div class="pt-c"><a class="pt-pill" dir="ltr" href="tel:${esc(p.phone)}">${ic('phone')} ${esc(p.phone)}</a><a class="pt-pill wa" dir="ltr" href="https://wa.me/${wa}" target="_blank" rel="noopener">${ic('message-circle')} ${esc(p.whatsapp)}</a></div>
    <div class="pt-st"><div><b>${r.visits.length}</b><small>زياراته عندك</small></div><div><b>${done.length}</b><small>كشوفات مكتملة</small></div><div><b>${done[0] ? fds(done[0].booking_date) : '—'}</b><small>آخر كشف</small></div></div>
    <section class="pt-sec"><h4>${ic('heart-pulse')} الحالة الصحية</h4>${chronic}${p.other_conditions ? `<div class="pt-note"><small>أمراض أخرى</small><p>${esc(p.other_conditions)}</p></div>` : ''}${p.notes ? `<div class="pt-note"><small>ملاحظات المريض</small><p>${esc(p.notes)}</p></div>` : ''}</section>
    <section class="pt-sec"><h4>${ic('clock')} سجل الزيارات عندك (${r.visits.length})</h4>${r.visits.map(visit).join('')}</section>
    <button class="btn p" style="width:100%;margin-top:18px" onclick="closeModal()">إغلاق</button></div>`, 'wide');
  } catch (e) { toast(e.message); }
}

/* ---------- لوحة الأدمن ---------- */
// لوحة الأدمن
function admin() { cur = async () => { try { A = (await api('/admin/doctors')).doctors; aview(); } catch (e) { toast(e.message); } }; cur(); }
const setTab = k => { tab = k; aview(); };
const ach = d => d.is_active ? chip(d.status) : '<span class="chip off">معطّل</span>';
function aview() {
  const sum = k => A.reduce((a, d) => a + d[k], 0);
  const nav = [['ov', 'layout-dashboard', 'نظرة عامة'], ['dl', 'users', 'الأطباء']].map(([k, i, l]) => `<button class="${tab === k ? 'on' : ''}" onclick="setTab('${k}')">${ic(i)}${l}</button>`).join('');
  const ov = `<div class="stats"><div class="st"><b>${A.filter(d => d.is_active).length}</b><small>أطباء مفعّلون</small></div><div class="st"><b>${sum('waiting')}</b><small>منتظرون الآن</small></div><div class="st"><b>${sum('in_progress')}</b><small>جارٍ الكشف</small></div><div class="st"><b>${sum('completed')}</b><small>أنهوا اليوم</small></div></div>
  <h2 class="sec">الطوابير الحالية</h2><div class="grid">${A.map(d => `<article class="card"><div class="row">${av(d)}<div><h3>${esc(d.name)}</h3><span class="sp">${esc(d.specialty)}</span></div>${ach(d)}</div><div class="qo">${d.queue.length ? d.queue.map(x => `<span class="${x.status === 'In Progress' ? 'cur2' : ''}">${x.queue_number} ${esc(x.patient_name)}${x.status === 'In Progress' ? ' (جارٍ)' : ''}</span>`).join('') : '<span>لا يوجد مرضى</span>'}</div></article>`).join('')}</div>`;
  const dl = `<div class="row sb" style="margin-bottom:12px"><h2>الأطباء (${A.length})</h2><button class="btn p" onclick="df()">${ic('plus')} إضافة طبيب</button></div><div class="card tw"><table class="tbl"><thead><tr><th>الطبيب</th><th>المستخدم</th><th>الحالة</th><th>منتظرون</th><th>الكشف</th><th>إجراءات</th></tr></thead><tbody>${A.map(d => `<tr><td><div class="row">${av(d)}<div><b>${esc(d.name)}</b><br><small class="mt">${esc(d.specialty)}</small></div></div></td><td dir="ltr">${esc(d.username)}</td><td>${ach(d)}</td><td>${d.waiting} (اليوم ${d.total})</td><td>${d.avg} د</td><td><div class="act"><button class="btn sm" onclick="df(${d.id})" aria-label="تعديل">${ic('pencil')}</button><button class="btn sm" onclick="ta(${d.id})" aria-label="تفعيل أو تعطيل">${ic(d.is_active ? 'ban' : 'check')}</button><button class="btn sm d" onclick="del(${d.id})" aria-label="حذف">${ic('trash-2')}</button></div></td></tr>`).join('')}</tbody></table></div>`;
  $('#m').innerHTML = `<div class="adm"><aside class="sbar">${nav}</aside><section>${tab === 'ov' ? ov : dl}</section></div><nav class="bn">${nav}</nav>`;
  done();
}
const ta = id => api('/admin/doctors/' + id, { method: 'PATCH', body: { is_active: !A.find(d => d.id === id).is_active } }).then(cur).catch(e => toast(e.message));
const del = id => confirm('حذف الطبيب نهائياً مع كل حجوزاته؟ يمكنك التعطيل بدلاً من الحذف.') && api('/admin/doctors/' + id, { method: 'DELETE' }).then(() => { toast('تم الحذف', 1); cur(); }).catch(e => toast(e.message));
// نموذج إضافة/تعديل طبيب (الصورة تُصغَّر 256px وتُحفظ في القاعدة)
function df(id) {
  const d = A.find(x => x.id === id) || {}; img = d.profile_image || '';
  modal(`<h3>${id ? 'تعديل بيانات الطبيب' : 'إضافة طبيب جديد'}</h3><form id="df"><div class="row" style="margin-top:12px"><div id="pv">${img ? `<img class="av" src="${esc(img)}" alt="">` : av({ name: d.name || '+' })}</div><label class="btn o sm" style="margin:0">${ic('image')} اختيار صورة<input type="file" accept="image/*" hidden id="fi"></label></div>
  <label>اسم الطبيب<input name="name" required maxlength="80" value="${esc(d.name)}"></label><label>التخصص<input name="specialty" required maxlength="80" value="${esc(d.specialty)}"></label>
  <label>نبذة مختصرة<textarea name="description" rows="2" maxlength="300">${esc(d.description)}</textarea></label>
  <label>اسم المستخدم<input name="username" required dir="ltr" pattern="[A-Za-z0-9_.]{3,30}" value="${esc(d.username)}"></label>
  <label>كلمة المرور${id ? ' (اتركها فارغة بدون تغيير)' : ''}<input name="password" type="password" dir="ltr" minlength="6" ${id ? '' : 'required'} autocomplete="new-password"></label>
  <label>متوسط مدة الكشف (دقيقة)<input name="avg" type="number" min="1" max="240" required value="${d.avg || 10}"></label>
  <label class="chk"><input type="checkbox" name="act" ${d.is_active === false ? '' : 'checked'}> الحساب مفعّل</label><label class="chk"><input type="checkbox" name="acc" ${d.accepting === false ? '' : 'checked'}> يستقبل الحجوزات</label>
  <div class="err" id="er"></div><button class="btn p lg">${id ? 'حفظ التعديلات' : 'إضافة الطبيب'}</button></form>`);
  $('#fi').onchange = e => {
    const f = e.target.files[0]; if (!f) return; const r = new FileReader();
    r.onload = () => { const i = new Image(); i.onload = () => { const s = 256, c = document.createElement('canvas'), m = Math.min(i.width, i.height); c.width = c.height = s; c.getContext('2d').drawImage(i, (i.width - m) / 2, (i.height - m) / 2, m, m, 0, 0, s, s); img = c.toDataURL('image/jpeg', .82); $('#pv').innerHTML = `<img class="av" src="${img}" alt="">`; }; i.src = r.result; };
    r.readAsDataURL(f);
  };
  $('#df').onsubmit = async e => {
    e.preventDefault(); const f = e.target;
    const body = { name: f.name.value, specialty: f.specialty.value, description: f.description.value, username: f.username.value, password: f.password.value, average_consultation_time: f.avg.value, profile_image: img, is_active: f.act.checked, accepting: f.acc.checked };
    try { await api(id ? '/admin/doctors/' + id : '/admin/doctors', { method: id ? 'PUT' : 'POST', body }); closeModal(); toast('تم الحفظ', 1); cur(); }
    catch (x) { $('#er').textContent = x.message; }
  };
}

/* ---------- التحديث الدوري (Polling) ---------- */
// الدوال الخادمية على Vercel لا تضمن بثاً لحظياً بين النسخ، فنحدّث الصفحة الحالية كل 5 ثوانٍ.
// يتوقف التحديث أثناء إخفاء التبويب أو فتح نافذة (حتى لا نقاطع الكتابة).
setInterval(() => { if (cur && !document.hidden && !$('.ov')) cur(); }, 5000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && cur && !$('.ov')) cur(); });
route();
</script>
