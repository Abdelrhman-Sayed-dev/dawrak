/* ===== إعادة تصميم: هوية Teal هادئة ===== */
:root{--p:#033482;--pd:#022152;--pl:#d9e4f5;--bg:#f1f4f8;--t:#041530;--m:#536177;--b:#d2dae7;--navy:#041530;--ac:#033482;--sh:none;--r:12px;--r2:8px}

form input:not([type=radio]):not([type=checkbox]):not([type=file]),form textarea,form select{border-radius:var(--r2);border-color:#c1cbdc;background:#fff}

let GPREV = {};
function track() {
  document.title = 'حجزي — دورك';

/* ---------- Google Sign-In + تسجيل حساب المريض ---------- */
const CFG = fetch('/api/config').then(r => r.json()).catch(() => ({}));
// رسم زر Google (يختفي لو GOOGLE_CLIENT_ID غير مضبوط)
async function gbtn() {
  const el = $('#gb'), c = await CFG;
  if (!el) return;
  if (!c.google_client_id) { el.parentElement.querySelector('.gsep')?.remove(); el.remove(); return; }
  for (let i = 0; i < 50 && !(window.google && google.accounts); i++) await new Promise(r => setTimeout(r, 100));
  if (!(window.google && google.accounts)) { el.innerHTML = '<p class="mt">تعذر تحميل تسجيل جوجل، تأكد من الاتصال بالإنترنت.</p>'; return; }
  if (!window._gi) { google.accounts.id.initialize({ client_id: c.google_client_id, callback: onGoogle }); window._gi = 1; }
  google.accounts.id.renderButton(el, { theme: 'outline', size: 'large', text: 'continue_with', shape: 'pill', locale: 'ar', width: Math.min(el.clientWidth || 320, 400) });
}
async function onGoogle(resp) {
  try {
    const r = await api('/google', { method: 'POST', body: { credential: resp.credential } });
    if (r.token) { localStorage.tok = r.token; localStorage.role = r.role; nav(DASH.patient); } else gsignup(r);
  } catch (e) { toast(e.message); }
}
function gsignup(r) {
  if (!$('#m')) $('#app').innerHTML = head() + '<main class="wrap" id="m"></main>' + foot();
  $('#m').innerHTML = `<form class="card lg-card wide" id="gf"><h2>أهلاً بك ${esc(r.name)}</h2><p class="mt">أكمل بياناتك لإنشاء حسابك (${esc(r.email)})</p>${baseFields({ name: r.name })}${medFields()}<div class="err" id="er"></div><button class="btn p lg">إنشاء الحساب</button></form>`;
  $('#gf').onsubmit = async e => {
    e.preventDefault();
    try {
      const t = await api('/google/register', { method: 'POST', body: { ...baseVals(e.target), signup_token: r.signup_token } });
      localStorage.tok = t.token; localStorage.role = t.role; nav(DASH.patient);
    } catch (x) { $('#er').textContent = x.message; }
  };

// تجهيز الملف للرفع: الصور تُصغَّر إلى 1800px، وPDF بحد 3 ميجا
const readFile = f => new Promise((res, rej) => {
  const r = new FileReader();
  if (f.type.startsWith('image/')) {
    r.onload = () => { const i = new Image(); i.onerror = () => rej(new Error('صورة غير صالحة')); i.onload = () => { const k = Math.min(1, 1800 / Math.max(i.width, i.height)), c = document.createElement('canvas'); c.width = Math.round(i.width * k); c.height = Math.round(i.height * k); c.getContext('2d').drawImage(i, 0, 0, c.width, c.height); res({ mime: 'image/jpeg', data: c.toDataURL('image/jpeg', .85).split(',')[1], name: f.name.replace(/\.\w+$/, '') + '.jpg' }); }; i.src = r.result; };
  } else if (f.type === 'application/pdf') {
    if (f.size > 3 * 1024 * 1024) return rej(new Error('حجم الملف يجب ألا يتجاوز 3 ميجا'));
    r.onload = () => res({ mime: f.type, data: r.result.split(',')[1], name: f.name });
  } else return rej(new Error('الملفات المسموحة: صور أو PDF'));
  r.readAsDataURL(f);
});

// تسجيل مريض: نبحث أولاً لتجنب التكرار، وإن لم يوجد نسجّله كمريض جديد
function rwalk() {
  modal(`<h3>تسجيل مريض / حجز جديد</h3><p class="mt">ابحث أولاً بالاسم أو رقم الهاتف لتجنب تكرار بيانات المريض.</p><form onsubmit="return false"><label>بحث<input id="rsq" autocomplete="off" placeholder="3 أحرف أو أرقام على الأقل"></label></form><div class="rs" id="rsr"><p class="mt">اكتب للبحث عن مريض مسجّل.</p></div><div class="err" id="er"></div><button type="button" class="btn o lg" id="rnw">${ic('user-plus')} مريض جديد غير مسجّل</button><button type="button" class="btn" style="width:100%;margin-top:10px" onclick="closeModal()">إغلاق</button>`);
  let t, seq = 0; const qi = $('#rsq'); qi.focus();
  qi.oninput = () => {
    clearTimeout(t); const v = qi.value.trim();
    if (v.length < 3) { $('#rsr').innerHTML = '<p class="mt">اكتب 3 أحرف أو أرقام على الأقل.</p>'; return; }
    t = setTimeout(async () => {
      const my = ++seq;
      try {
        const r = await api('/reception/patients?q=' + encodeURIComponent(v)); if (my !== seq) return;
        $('#rsr').innerHTML = r.length ? r.map(p => `<div class="rsi"><div class="fl"><b>${esc(p.name)}</b><small dir="ltr">${esc(p.phone)}${p.age != null ? ' · ' + esc(p.age) + ' سنة' : ''}</small><small>${p.kind === 'account' ? 'حساب أونلاين' : 'سجل حضور سابق'}${p.booked ? ' · لديه حجز نشط اليوم' : ''}</small></div><button class="btn p sm" ${p.booked ? 'disabled' : ''} onclick="rbook('${p.kind}',${p.id})">حجز دور</button></div>`).join('') : '<p class="mt">لا توجد نتائج. سجّله كمريض جديد.</p>';
      } catch (x) { $('#er').textContent = x.message; }
    }, 300);
  };
  $('#rnw').onclick = () => rnew(qi.value.trim());
}
function rnew(v) {
  modal(`<h3>مريض جديد</h3><form id="rnf" novalidate><label>الاسم الكامل<input name="pname" maxlength="60" value="${/\d/.test(v) ? '' : esc(v)}"></label><label>رقم الهاتف<input name="phone" type="tel" dir="ltr" inputmode="tel" value="${/^[\d+\s-]+$/.test(v) ? esc(v) : ''}"></label><div class="err" id="er"></div><button class="btn p lg">تسجيل وحجز دور</button><button type="button" class="btn" style="width:100%;margin-top:10px" onclick="rwalk()">رجوع للبحث</button></form>`);
  $('#rnf').onsubmit = async e => {
    e.preventDefault(); const f = e.target.elements, ph = f.phone.value.replace(/[\s-]/g, '');
    const data = { name: f.pname.value, phone: f.phone.value };
    if (/^\+?\d{8,15}$/.test(ph)) {
      try {
        const k = s => String(s).replace(/\D/g, '').slice(-10);
        const m = (await api('/reception/patients?q=' + encodeURIComponent(ph))).filter(p => k(p.phone) === k(ph));
        if (m.length) return rdup(m, data);
      } catch (x) { /* لو فشل البحث يتحقق السيرفر على أي حال */ }
    }
    rbook('new', null, data);
  };
}
// رقم الهاتف مسجّل من قبل: نعرض المريض الموجود بدل إنشاء سجل مكرر
function rdup(list, data) {
  modal(`<h3>المريض مسجّل بالفعل</h3><p class="mt">رقم الهاتف <b dir="ltr">${esc(data.phone)}</b> مسجّل مسبقاً، فلن يُنشأ سجل جديد. اختر المريض لحجز دور له:</p><div class="rs">${list.map(p => `<div class="rsi"><div class="fl"><b>${esc(p.name)}</b><small dir="ltr">${esc(p.phone)}${p.age != null ? ' · ' + esc(p.age) + ' سنة' : ''}</small><small>${p.kind === 'account' ? 'حساب أونلاين' : 'سجل حضور سابق'}${p.booked ? ' · لديه حجز نشط اليوم' : ''}</small></div><button class="btn p sm" ${p.booked ? 'disabled' : ''} onclick="rbook('${p.kind}',${p.id})">حجز دور</button></div>`).join('')}</div><div class="err" id="er"></div><button type="button" class="btn" style="width:100%;margin-top:10px" onclick="rnew('${esc(data.phone)}')">رجوع</button><button type="button" class="btn" style="width:100%;margin-top:10px" onclick="closeModal()">إغلاق</button>`);
}
async function rbook(kind, id, extra = {}) {
  try {
    const r = await api('/reception/bookings', { method: 'POST', body: { kind, id, ...extra } });
    closeModal(); toast('تم تسجيل الحجز برقم ' + r.booking.queue_number, 1); cur();
  } catch (x) { const e = $('#er'); if (e) e.textContent = x.message; else toast(x.message); }
}

/* ----- تذكير الأدوية ----- */
const DS = { Pending: ['قيد الانتظار', 'warn'], Taken: ['تم أخذها', 'ok'], Skipped: ['تم تخطيها', 'off'] };
const DISC = '<div class="disc">التذكير لتنظيم المواعيد فقط. التزم بالجرعة وتعليمات طبيبك كما هي في الروشتة، والنظام لا يغيّر أي جرعة ولا يقدّم نصائح طبية.</div>';
async function askNotif() {
  try {
    if ('Notification' in window && Notification.permission === 'default') await Notification.requestPermission();
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
  } catch (e) { /* المتصفح لا يدعم الإشعارات: يبقى التنبيه داخل الموقع */ }
}
function pushNote(title, body) {
  try {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    const fall = () => { try { new Notification(title, { body }); } catch (e) { /* أندرويد يحتاج service worker */ } };
    if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistration().then(r => r ? r.showNotification(title, { body, tag: 'dawrak-med' }) : fall()).catch(fall); else fall();
  } catch (e) { /* ignore */ }
}
function remPick(bid) {
  const x = HB.find(v => v.id === bid); if (!x || !x.medications.length) return;
  modal(`<h3>تذكير بالأدوية</h3><p class="mt">اختر الدواء الذي تريد تذكيراً به</p>${DISC}${x.medications.map((m, i) => `<div class="dz"><div class="dzi"><b>${esc(m.name)}</b><br><small class="mt">${esc([m.dose, m.freq].filter(Boolean).join(' — '))}</small></div><button class="btn p sm" onclick="remForm(${bid},${i})">${ic('bell')} تفعيل</button></div>`).join('')}<button class="btn o lg" style="margin-top:8px" onclick="closeModal()">إغلاق</button>`);
}
function remForm(bid, idx, r) {
  const m = r ? null : (HB.find(v => v.id === bid) || { medications: [] }).medications[idx];
  const name = r ? r.medicine_name : m && m.name; if (!name) return;
  const note = r ? r.dose_note : [m.dose, m.freq].filter(Boolean).join(' — ');
  modal(`<h3>${r ? 'تعديل التذكير' : 'تفعيل التذكير'}</h3><p><b>${esc(name)}</b></p>${note ? `<p class="mt">${esc(note)}</p>` : ''}${DISC}
    <label>مواعيد الجرعات (من 1 إلى 6 مرات يومياً)</label><div class="tms" id="tms"></div>
    <button type="button" class="btn o sm" id="addt">${ic('plus')} إضافة موعد</button>
    <label style="margin-top:10px">مدة العلاج (بالأيام، من 1 إلى 90)<input id="rd" type="number" min="1" max="90" value="${r ? r.days_left : 7}"></label>
    <div class="err" id="er"></div><button class="btn p lg" id="rsv">حفظ</button>`);
  const box = $('#tms'), add = v => { if (box.children.length >= 6) return; box.insertAdjacentHTML('beforeend', `<span><input type="time" required value="${v}">${box.children.length ? `<button type="button" class="btn d sm" aria-label="حذف الموعد" onclick="this.parentElement.remove()">${ic('x')}</button>` : ''}</span>`); };
  (r ? r.times : ['08:00']).forEach(add);
  $('#addt').onclick = () => add('12:00');
  $('#rsv').onclick = async e => {
    const times = [...box.querySelectorAll('input')].map(i => i.value).filter(Boolean), days = Number($('#rd').value);
    if (!times.length) { $('#er').textContent = 'أضف موعداً واحداً على الأقل'; return; }
    const btn = e.currentTarget; btn.disabled = true;
    try {
      await api(r ? '/me/reminders/' + r.id : '/me/reminders', { method: r ? 'PUT' : 'POST', body: r ? { times, days } : { booking_id: bid, med_index: idx, times, days } });
      await askNotif(); closeModal(); toast(r ? 'تم تعديل التذكير' : 'تم تفعيل التذكير', 1);
      if (r) { if (cur) cur(); } else nav('/patient/reminders');
    } catch (x) { $('#er').textContent = x.message; btn.disabled = false; }
  };
}
function remsPage() {
  document.title = 'تذكير الأدوية — دورك';
  $('#m').innerHTML = '<h2 class="sec2">تذكير الأدوية</h2><div id="rm"></div>';
  cur = async () => { try { remView(await api('/me/reminders')); } catch (e) { toast(e.message); } };
  cur();
}
let RM = [];
function remView({ reminders, doses }) {
  RM = reminders; const now = Date.now(), today = new Date().toDateString();
  const day = t => { const d = new Date(t); return d.toDateString() === today ? 'اليوم' : d.toDateString() === new Date(now + 864e5).toDateString() ? 'غداً' : d.toDateString() === new Date(now - 864e5).toDateString() ? 'أمس' : fdd(t); };
  let last = '';
  const dz = doses.map(d => { const late = d.status === 'Pending' && new Date(d.scheduled_at) < now, lab = day(d.scheduled_at), hd = lab !== last ? `<h4 style="margin:12px 0 6px">${lab}</h4>` : ''; last = lab;
    return `${hd}<div class="dz ${late ? 'late' : ''} ${d.status !== 'Pending' ? 'done' : ''}"><span class="tmx">${tm(d.scheduled_at)}</span><div class="dzi"><b>${esc(d.medicine_name)}</b>${d.dose_note ? `<br><small class="mt">${esc(d.dose_note)}</small>` : ''}${d.for_name ? `<br><small class="mt">لـ ${esc(d.for_name)}</small>` : ''}</div><span class="chip ${late ? 'warn' : DS[d.status][1]}">${late ? 'فائتة — لم تُسجَّل' : DS[d.status][0]}</span>
      <div class="hacts">${d.status === 'Pending' ? `<button class="btn ok sm" onclick="dose(${d.id},'Taken')">${ic('check')} تم أخذها</button><button class="btn o sm" onclick="dose(${d.id},'Skipped')">تخطي</button>` : `<button class="btn o sm" onclick="dose(${d.id},'Pending')">تراجع</button>`}</div></div>`; }).join('');
  const notif = 'Notification' in window && Notification.permission === 'default' ? `<button class="btn o sm" onclick="askNotif().then(()=>cur())">${ic('bell')} تفعيل إشعارات المتصفح</button><p class="mt" style="margin:6px 0 10px">الإشعارات تصل والموقع مفتوح (حتى في تبويب خلفي). لا يتم الإرسال والموقع مغلق تماماً.</p>` : '';
  $('#rm').innerHTML = DISC + notif + `<h3 class="sec2" style="margin-top:14px">الجرعات القادمة</h3>${dz || '<p class="empty card">لا توجد جرعات في الـ 48 ساعة القادمة.</p>'}
    <h3 class="sec2" style="margin-top:18px">تذكيراتي</h3>${reminders.length ? reminders.map(r => `<article class="card rmc"><div class="row sb"><b>${esc(r.medicine_name)}</b><span class="chip ${r.is_active ? 'ok' : 'off'}">${r.is_active ? 'مفعّل' : 'موقوف'}</span></div>${r.dose_note ? `<small class="mt">${esc(r.dose_note)}</small><br>` : ''}<small class="mt">${r.times.join(' · ')} — حتى ${fds(r.end_date)} — د. ${esc(r.doctor_name)}${r.for_name ? ' — لـ ' + esc(r.for_name) : ''}</small><br><small class="mt">أُخذت: ${r.taken} · تُخطّيت: ${r.skipped} · قادمة/معلّقة: ${r.pending}</small>
      <div class="acts"><button class="btn o sm" onclick="remEdit(${r.id})">${ic('pencil')} تعديل</button><button class="btn o sm" onclick="remToggle(${r.id},${!r.is_active})">${ic(r.is_active ? 'pause' : 'play')} ${r.is_active ? 'إيقاف' : 'استئناف'}</button><button class="btn d sm" onclick="remDel(${r.id})">${ic('trash-2')} حذف</button></div></article>`).join('') : '<p class="empty card">لا توجد تذكيرات. افتح الروشتة من «حجوزاتي» واضغط «تذكير بالأدوية».</p>'}`;
}
const dose = (id, status) => api('/me/doses/' + id, { method: 'POST', body: { status } }).then(() => cur()).catch(e => toast(e.message));
const remEdit = id => { const r = RM.find(x => x.id === id); if (r) remForm(0, 0, r); };
const remToggle = (id, is_active) => api('/me/reminders/' + id, { method: 'PATCH', body: { is_active } }).then(() => { toast(is_active ? 'تم استئناف التذكير' : 'تم إيقاف التذكير', 1); cur(); }).catch(e => toast(e.message));
const remDel = id => confirm('حذف هذا التذكير وكل جرعاته؟') && api('/me/reminders/' + id, { method: 'DELETE' }).then(() => cur()).catch(e => toast(e.message));
// فحص دوري للجرعات التي حان موعدها (يعمل والموقع مفتوح، حتى في تبويب خلفي)
async function remPoll() {
  if (localStorage.role !== 'patient' || !localStorage.tok) return;
  try {
    const r = await api('/me/reminders/due');
    r.due.forEach(d => { toast('حان موعد دواء ' + d.medicine_name, 1); pushNote('تذكير دواء', d.medicine_name + (d.dose_note ? ' — ' + d.dose_note : '') + (d.for_name ? ' (' + d.for_name + ')' : '')); navigator.vibrate?.(300); });
    if (r.due.length && R() === '/reminders' && cur && !$('.ov')) cur();
  } catch (e) { /* يُعاد المحاولة بعد 30 ثانية */ }
}
setInterval(remPoll, 30000); setTimeout(remPoll, 3000);

/* ---------- التحديث الدوري (Polling) ---------- */
// الدوال الخادمية على Vercel لا تضمن بثاً لحظياً بين النسخ، فنحدّث الصفحة الحالية كل 5 ثوانٍ.
// يتوقف التحديث أثناء إخفاء التبويب أو فتح نافذة (حتى لا نقاطع الكتابة).
setInterval(() => { if (cur && !document.hidden && !$('.ov')) cur(); }, 5000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && cur && !$('.ov')) cur(); });
route();
</script>
</body>
</html>
